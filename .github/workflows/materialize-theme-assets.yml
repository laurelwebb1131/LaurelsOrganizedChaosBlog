name: Materialize homepage art assets

on:
  workflow_dispatch:
  push:
    branches: [homepage-final-mockup]
    paths:
      - '.asset-transfer/**'
      - 'scripts/materialize-theme-assets.mjs'
      - '.github/workflows/materialize-theme-assets.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homepage-final-mockup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image processor
        run: npm install --no-save --ignore-scripts=false sharp@0.34.4
      - name: Generate individual assets
        run: node scripts/materialize-theme-assets.mjs
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/loc
          if git diff --cached --quiet; then
            echo "No generated asset changes."
          else
            git commit -m "Materialize approved homepage art assets"
            git pull --rebase origin homepage-final-mockup
            git push origin HEAD:homepage-final-mockup
          fi
